name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # Throwaway CI-only credentials; nothing here is a real secret.
      DATABASE_URL: postgres://eightcore_app:eightcore@localhost:5432/eightcore
      DATABASE_MIGRATOR_URL: postgres://eightcore_migrator:eightcore@localhost:5432/eightcore
      BETTER_AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-0000
      BETTER_AUTH_URL: http://localhost:3000
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Bootstrap database roles
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f docker/postgres/00-bootstrap.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -d eightcore -f docker/postgres/sql/grants.sql
          npm run db:migrate

      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run licenses:check
      - run: npm test
      - run: npm run build
      - run: npm run secrets:scan

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
